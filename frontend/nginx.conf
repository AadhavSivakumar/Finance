server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS is at 127.0.0.11 inside a user-defined network.
    # Without this resolver + the variable below, nginx resolves `api` ONCE at
    # startup and caches the IP forever -- so a `docker compose restart api`
    # (new container, new IP) turns every request into 502 until nginx also
    # restarts. This is the single most common Compose+nginx bug.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never let a proxy or browser hold a stale index.html: it is the file that
    # points at the hashed bundles, so a stale copy pins users to a deleted
    # build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health/ {
        set $health_upstream http://api:8000;
        proxy_pass $health_upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback: any unmatched path returns index.html so client-side
    # routing works on a hard refresh. It must come LAST -- it matches
    # everything.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening. A real deployment adds a Content-Security-Policy here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
